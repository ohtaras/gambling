name: Φράσεις Τζόκερ
on:
  schedule:
    - cron: '25 19,20,21 * * 0,2,4'   # μετά την κλήρωση (22:00 Ελλάδας) Τρίτη, Πέμπτη, Κυριακή
    - cron: '15 5 * * 1,3,5'          # εφεδρικά το πρωί
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: joker-frasi
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Εργαλεία
        run: |
          pip install -q astral
          sudo apt-get -qq install -y libssl-dev >/dev/null
          gcc -O3 -o tools/joker_seek tools/joker_seek.c -lcrypto
      - name: Νέες κληρώσεις, φράσεις και πρόβλεψη
        run: python3 tools/joker_frasi.py update
      - name: Commit
        run: |
          git config user.name "joker-frasi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/joker.json data/joker_frasi.json
          if git diff --cached --quiet; then echo "τίποτα νέο"; exit 0; fi
          git commit -m "Φράσεις Τζόκερ: ενημέρωση $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
