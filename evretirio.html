<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ευρετήριο ΚΙΝΟ</title>
<style>
:root{--bg:#0f1420;--panel:#171e2e;--line:#2a3550;--text:#e8ecf5;--muted:#8c97b0;--accent:#3b82f6;--cell:#101726;--num:#55627f}
@media (prefers-color-scheme: light){:root{--bg:#f3f5fa;--panel:#fff;--line:#dbe2ee;--text:#141a29;--muted:#5d6984;--cell:#f3f5fa;--num:#9aa5bd}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 12px 8px}
a.back{color:var(--muted);text-decoration:none;font-size:14px}
h1{font-size:22px;margin:6px 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 6px;min-height:18px}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.lbl{font-size:13px;color:var(--muted);margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.c{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;font-size:12px;line-height:1.05;background:var(--cell);color:var(--num);border:1px solid transparent;font-variant-numeric:tabular-nums}
.c small{font-size:9px;opacity:.85}
.pick .c{cursor:pointer;font-size:14px;user-select:none;-webkit-tap-highlight-color:transparent}
.pick .c.on{background:#22c55e;color:#04210f;font-weight:700}
.c.d{background:#f5b301;color:#2b1e00;font-weight:700}
.c.p{background:#22c55e;color:#04210f;font-weight:700}
.c.o{border:1px dashed #22c55e;color:#22c55e}
.c.hot{background:#dc2626;color:#fff;font-weight:700}
.c.cold{background:#2563eb;color:#fff;font-weight:700}
.c.mid{color:var(--text)}
input[type=text],select,button{font:inherit;color:var(--text);background:var(--cell);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input[type=text]{width:100%;margin:10px 0}
button{cursor:pointer}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;flex:1}
button:disabled{opacity:.45;cursor:default}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;margin:2px 0 12px;min-height:32px}
.chk input{width:22px;height:22px;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row select{flex:1;min-width:150px}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.nav span{flex:1;text-align:center;font-size:14px;color:var(--muted)}
.hd{font-size:15px;margin-bottom:8px}
.hd b{font-size:16px}
.hd em{font-style:normal;color:var(--muted);font-size:13px}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:600px){.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cap{font-size:13px;color:var(--muted);margin-bottom:5px}
.cap b{color:var(--text)}
.big{font-size:18px;font-weight:600;margin-bottom:4px}
.leg{font-size:12px;color:var(--muted);margin-top:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:3px}
.err{color:#f87171}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">‹ Εργαλεία</a>
  <h1>🔎 Ευρετήριο ΚΙΝΟ</h1>
  <p class="sub" id="st">Φόρτωση ιστορικού…</p>
  <div class="bar"><i id="pg"></i></div>

  <div class="panel">
    <div class="lbl">Πάτα τους αριθμούς στον πίνακα ή γράψ' τους από κάτω</div>
    <div class="grid pick" id="pick"></div>
    <input type="text" id="txt" inputmode="numeric" autocomplete="off" placeholder="π.χ. 31 32 33 41 43 51 52 53">
    <label class="chk"><input type="checkbox" id="any"> Το ίδιο σχήμα οπουδήποτε στον πίνακα</label>
    <div class="row">
      <select id="ord"><option value="old">Πιο παλιές πρώτα</option><option value="new">Πιο πρόσφατες πρώτα</option></select>
      <button id="go" class="pri" disabled>Αναζήτηση</button>
      <button id="clr">Καθάρισμα</button>
    </div>
  </div>

  <div id="sum"></div>
  <div id="nav1" class="nav"></div>
  <div id="res"></div>
  <div id="nav2" class="nav"></div>
</div>

<script id="core">
/* Πυρήνας αναζήτησης (χωρίς DOM): bitsets ανά αριθμό για όλο το ιστορικό.
   bits/YYYY-MM.bin: για κάθε αριθμό 1..80, W=ceil(n/32) λέξεις uint32 LE· bit i = βγήκε στην i-οστή κλήρωση του μήνα. */
var KC = {};
KC.build = function(files, bufs){
  var total = 0, m, k, j;
  for(m = 0; m < files.length; m++) total += files[m].n;
  var GW = ((total + 31) >>> 5) + 2, G = [];
  for(k = 0; k < 80; k++) G.push(new Uint32Array(GW));
  var off = 0, offs = [];
  for(m = 0; m < files.length; m++){
    var n = files[m].n, W = (n + 31) >>> 5, dv = new DataView(bufs[m]);
    if(dv.byteLength !== 80 * W * 4) throw new Error('μέγεθος ' + files[m].f);
    offs.push(off);
    var wo = off >>> 5, sh = off & 31;
    for(k = 0; k < 80; k++){
      var g = G[k], base = k * W * 4;
      for(j = 0; j < W; j++){
        var w = dv.getUint32(base + j * 4, true);
        if(!w) continue;
        g[wo + j] |= (w << sh);
        if(sh) g[wo + j + 1] |= (w >>> (32 - sh));
      }
    }
    off += n;
  }
  offs.push(off);
  return {G: G, offs: offs, total: off};
};
/* όλες οι κληρώσεις (θέση στο ιστορικό, αύξουσα) που περιέχουν όλους τους αριθμούς */
KC.find = function(S, nums){
  var G = S.G, a = G[nums[0] - 1], L = a.length, out = [], i, k, w, b;
  for(i = 0; i < L; i++){
    w = a[i]; if(!w) continue;
    for(k = 1; k < nums.length && w; k++) w &= G[nums[k] - 1][i];
    while(w){ b = w & -w; out.push(i * 32 + (31 - Math.clz32(b))); w ^= b; }
  }
  return out;
};
/* το ίδιο σχήμα μετακινημένο σε κάθε θέση του πίνακα 8x10 όπου χωράει */
KC.shapes = function(nums){
  var c = nums.map(function(n){ return [Math.floor((n - 1) / 10), (n - 1) % 10]; });
  var r0 = 9, r1 = 0, c0 = 9, c1 = 0;
  c.forEach(function(x){ r0 = Math.min(r0, x[0]); r1 = Math.max(r1, x[0]); c0 = Math.min(c0, x[1]); c1 = Math.max(c1, x[1]); });
  var out = [];
  for(var dr = -r0; dr <= 7 - r1; dr++) for(var dc = -c0; dc <= 9 - c1; dc++)
    out.push(c.map(function(x){ return (x[0] + dr) * 10 + x[1] + dc + 1; }).sort(function(a, b){ return a - b; }));
  return out;
};
KC.has = function(S, n, g){ return (S.G[n - 1][g >>> 5] >>> (g & 31)) & 1; };
KC.draw = function(S, g){ var a = []; for(var n = 1; n <= 80; n++) if(KC.has(S, n, g)) a.push(n); return a; };
KC.locate = function(S, g){ var lo = 0, hi = S.offs.length - 2; while(lo < hi){ var md = (lo + hi + 1) >> 1; if(S.offs[md] <= g) lo = md; else hi = md - 1; } return [lo, g - S.offs[lo]]; };
if(typeof module !== 'undefined') module.exports = KC;
</script>

<script>
(function(){
  var PER = 10, S = null, IDX = null, R = [], page = 0, sel = [], RECS = {};
  var $ = function(id){ return document.getElementById(id); };
  var fmtN = function(n){ return n.toLocaleString('el-GR'); };
  var fmtT = function(sec){ return new Date(sec * 1000).toLocaleString('el-GR', {timeZone: 'Europe/Athens', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false}); };

  /* ---------- επιλογή αριθμών ---------- */
  var pick = $('pick'), h = '';
  for(var n = 1; n <= 80; n++) h += '<div class="c" data-n="' + n + '">' + n + '</div>';
  pick.innerHTML = h;
  function paintSel(fromTxt){
    var cs = pick.children;
    for(var i = 0; i < 80; i++) cs[i].className = 'c' + (sel.indexOf(i + 1) >= 0 ? ' on' : '');
    if(!fromTxt) $('txt').value = sel.join(' ');
  }
  pick.addEventListener('click', function(e){
    var t = e.target.closest('.c'); if(!t) return;
    var v = +t.getAttribute('data-n'), i = sel.indexOf(v);
    if(i >= 0) sel.splice(i, 1); else if(sel.length < 20) sel.push(v);
    sel.sort(function(a, b){ return a - b; }); paintSel(false);
  });
  function parseTxt(s){
    var out = [];
    (s.match(/\d+/g) || []).forEach(function(x){ var v = +x; if(v >= 1 && v <= 80 && out.indexOf(v) < 0 && out.length < 20) out.push(v); });
    return out.sort(function(a, b){ return a - b; });
  }
  $('txt').addEventListener('input', function(){ sel = parseTxt(this.value); paintSel(true); });
  $('txt').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ this.blur(); search(); } });
  $('clr').addEventListener('click', function(){ sel = []; paintSel(false); R = []; $('sum').innerHTML = ''; $('res').innerHTML = ''; nav(); history.replaceState(null, '', location.pathname); });
  $('go').addEventListener('click', function(){ search(); });
  $('ord').addEventListener('change', function(){ if(R.length){ page = 0; saveHash(); render(); } });

  /* ---------- φόρτωση ιστορικού ---------- */
  function getBuf(u){ return fetch(u).then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status + ' ' + u); return r.arrayBuffer(); }); }
  function load(retry){
    return fetch('data/kino/index.json?t=' + Date.now()).then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then(function(idx){
      IDX = idx; var F = idx.files, bufs = new Array(F.length), next = 0, done = 0;
      function one(){
        if(next >= F.length) return Promise.resolve();
        var m = next++;
        return getBuf('data/kino/bits/' + F[m].f + (m >= F.length - 2 ? '?v=' + idx.updated : '')).then(function(b){
          bufs[m] = b; done++;
          $('pg').style.width = (done / F.length * 100).toFixed(0) + '%';
          $('st').textContent = 'Φόρτωση ιστορικού… ' + done + '/' + F.length + ' μήνες';
          return one();
        });
      }
      var ws = []; for(var i = 0; i < 8; i++) ws.push(one());
      return Promise.all(ws).then(function(){ S = KC.build(F, bufs); });
    }).catch(function(e){
      if(!retry) return new Promise(function(ok){ setTimeout(ok, 1500); }).then(function(){ return load(true); });
      throw e;
    });
  }
  function recs(m){
    if(RECS[m]) return RECS[m];
    var F = IDX.files;
    return RECS[m] = getBuf('data/kino/' + F[m].f + (m >= F.length - 2 ? '?v=' + IDX.updated : '')).then(function(b){ return new DataView(b); });
  }
  function info(g){ /* {id, t} της κλήρωσης στη θέση g */
    var lm = KC.locate(S, g);
    return recs(lm[0]).then(function(dv){ var o = lm[1] * 31; if(o + 8 > dv.byteLength) return null; return {id: dv.getUint32(o, true), t: dv.getUint32(o + 4, true)}; });
  }

  /* ---------- αναζήτηση ---------- */
  function search(keepPage){
    if(!S) return;
    if(!sel.length){ $('sum').innerHTML = '<div class="panel">Διάλεξε τουλάχιστον έναν αριθμό.</div>'; $('res').innerHTML = ''; R = []; nav(); return; }
    var any = $('any').checked, shapes = any ? KC.shapes(sel) : [sel.slice()], map = new Map();
    shapes.forEach(function(sh){
      KC.find(S, sh).forEach(function(g){ if(g >= S.total) return; var e = map.get(g); if(e) e.push(sh); else map.set(g, [sh]); });
    });
    R = Array.from(map.keys()).sort(function(a, b){ return a - b; }).map(function(g){
      var u = []; map.get(g).forEach(function(sh){ sh.forEach(function(v){ if(u.indexOf(v) < 0) u.push(v); }); });
      return {g: g, pat: u.sort(function(a, b){ return a - b; })};
    });
    if(!keepPage) page = 0;
    saveHash(); summary(shapes.length, any); render();
  }
  function summary(nShapes, any){
    var k = sel.length, N = R.length, el = $('sum');
    if(!N){ el.innerHTML = '<div class="panel"><div class="big">Δεν βρέθηκε καμία κλήρωση</div><div class="lbl" style="margin:0">' + (any ? 'Το σχήμα δεν έχει βγει ολόκληρο σε καμία θέση του πίνακα.' : 'Αυτοί οι αριθμοί δεν έχουν βγει ποτέ όλοι μαζί. Δοκίμασε με λιγότερους ή με το «οπουδήποτε στον πίνακα».') + '</div></div>'; return; }
    var cnt = new Uint32Array(81), rep = 0, M = 0;
    R.forEach(function(r){
      var g = r.g + 1; if(g >= S.total) return; M++;
      for(var n = 1; n <= 80; n++) if(KC.has(S, n, g)) cnt[n]++;
      r.pat.forEach(function(v){ if(KC.has(S, v, g)) rep++; });
    });
    var order = []; for(var n = 1; n <= 80; n++) order.push(n);
    order.sort(function(a, b){ return cnt[b] - cnt[a] || a - b; });
    var hot = order.slice(0, 10), cold = order.slice(-10), b = '';
    for(n = 1; n <= 80; n++) b += '<div class="c ' + (hot.indexOf(n) >= 0 ? 'hot' : cold.indexOf(n) >= 0 ? 'cold' : 'mid') + '">' + n + '<small>' + cnt[n] + '</small></div>';
    el.innerHTML = '<div class="panel"><div class="big">Βρέθηκαν ' + fmtN(N) + (N === 1 ? ' κλήρωση' : ' κληρώσεις') + '</div>' +
      '<div class="lbl">' + (any ? 'Το σχήμα δοκιμάστηκε σε ' + nShapes + ' θέσεις του πίνακα. ' : '') +
      (M ? 'Στην επόμενη κλήρωση ξαναβγήκαν κατά μέσο όρο ' + (rep / M).toFixed(2).replace('.', ',') + ' από τους ' + k + ' αριθμούς.' : '') + '</div>' +
      (M ? '<div class="cap"><b>Τι ακολούθησε συνολικά</b> · πόσες φορές βγήκε κάθε αριθμός στην επόμενη κλήρωση (σε ' + fmtN(M) + ')</div><div class="grid">' + b + '</div>' +
      '<div class="leg"><span class="dot" style="background:#dc2626"></span>τα 10 πιο συχνά &nbsp; <span class="dot" style="background:#2563eb"></span>τα 10 πιο σπάνια</div>' : '') + '</div>';
  }
  function board(drawn, pat, showMissing){
    var s = '<div class="grid">';
    for(var n = 1; n <= 80; n++){
      var d = drawn.indexOf(n) >= 0, p = pat.indexOf(n) >= 0;
      s += '<div class="c' + (d ? (p ? ' p' : ' d') : (p && showMissing ? ' o' : '')) + '">' + n + '</div>';
    }
    return s + '</div>';
  }
  var token = 0;
  function render(){
    nav();
    var my = ++token, box = $('res');
    if(!R.length){ box.innerHTML = ''; return; }
    var list = $('ord').value === 'new' ? R.slice().reverse() : R, part = list.slice(page * PER, page * PER + PER);
    box.innerHTML = '<div class="panel lbl" style="margin-bottom:12px">Φόρτωση κληρώσεων…</div>';
    Promise.all(part.map(function(r){
      var hasNext = r.g + 1 < S.total;
      return Promise.all([info(r.g), hasNext ? info(r.g + 1) : null]).then(function(x){ return {r: r, a: x[0], b: x[1]}; });
    })).then(function(rows){
      if(my !== token) return;
      box.innerHTML = rows.map(function(o){
        var r = o.r, d1 = KC.draw(S, r.g), s = '<div class="card"><div class="hd"><b>#' + (o.a ? o.a.id : '—') + '</b> · ' + (o.a ? fmtT(o.a.t) : '') +
          ($('any').checked ? ' <em>· σχήμα στα ' + r.pat.join(', ') + '</em>' : '') + '</div><div class="two">';
        s += '<div><div class="cap"><b>Η κλήρωση</b></div>' + board(d1, r.pat, false) + '</div>';
        if(o.b){
          var d2 = KC.draw(S, r.g + 1), back = r.pat.filter(function(v){ return d2.indexOf(v) >= 0; });
          s += '<div><div class="cap"><b>Τι ακολούθησε</b> · #' + o.b.id + (o.a && o.b.id !== o.a.id + 1 ? ' (η επόμενη διαθέσιμη)' : '') + ' · ' + fmtT(o.b.t).slice(-5) +
            ' · ξαναβγήκαν: ' + (back.length ? back.join(', ') : 'κανένα') + '</div>' + board(d2, r.pat, true) + '</div>';
        } else s += '<div><div class="cap">Η επόμενη κλήρωση δεν έχει μπει ακόμα στο αρχείο.</div></div>';
        return s + '</div></div>';
      }).join('') + '<div class="leg" style="margin:0 4px 12px"><span class="dot" style="background:#22c55e"></span>οι αριθμοί σου &nbsp; <span class="dot" style="background:#f5b301"></span>οι υπόλοιποι που κληρώθηκαν &nbsp; <span class="dot" style="border:1px dashed #22c55e"></span>δικός σου που δεν ξαναβγήκε</div>';
    }).catch(function(e){ if(my === token) box.innerHTML = '<div class="panel err">Δεν φορτώθηκαν οι κληρώσεις (' + e.message + '). Δοκίμασε ξανά.</div>'; });
  }
  function nav(){
    var pages = Math.ceil(R.length / PER);
    [$('nav1'), $('nav2')].forEach(function(el, ix){
      if(pages <= 1){ el.innerHTML = ''; return; }
      el.innerHTML = '<button data-d="-1"' + (page <= 0 ? ' disabled' : '') + '>‹ Προηγ. 10</button><span>' + fmtN(page * PER + 1) + '–' + fmtN(Math.min(R.length, page * PER + PER)) + ' από ' + fmtN(R.length) + '</span><button data-d="1"' + (page >= pages - 1 ? ' disabled' : '') + '>Επόμ. 10 ›</button>';
      el.onclick = function(e){
        var b = e.target.closest('button'); if(!b || b.disabled) return;
        page = Math.max(0, Math.min(pages - 1, page + (+b.getAttribute('data-d')))); saveHash(); render();
        if(ix === 1) $('nav1').scrollIntoView({behavior: 'smooth', block: 'start'});
      };
    });
  }

  /* ---------- σύνδεσμος που θυμάται την αναζήτηση ---------- */
  function saveHash(){ try{ history.replaceState(null, '', '#n=' + sel.join(',') + ($('any').checked ? '&any=1' : '') + ($('ord').value === 'new' ? '&ord=new' : '') + (page ? '&p=' + (page + 1) : '')); }catch(e){} }
  function readHash(){
    var q = {}; location.hash.replace(/^#/, '').split('&').forEach(function(kv){ var i = kv.indexOf('='); if(i > 0) q[kv.slice(0, i)] = kv.slice(i + 1); });
    if(!q.n) return false;
    sel = parseTxt(q.n); $('any').checked = q.any === '1'; $('ord').value = q.ord === 'new' ? 'new' : 'old'; page = Math.max(0, (+q.p || 1) - 1); paintSel(false);
    return sel.length > 0;
  }

  var pending = readHash();
  load(false).then(function(){
    $('pg').parentNode.style.display = 'none'; $('go').disabled = false;
    $('st').textContent = 'Ιστορικό: ' + fmtN(S.total) + ' κληρώσεις';
    Promise.all([info(0), info(S.total - 1)]).then(function(x){ if(x[0] && x[1]) $('st').textContent = 'Ιστορικό: ' + fmtN(S.total) + ' κληρώσεις · ' + fmtT(x[0].t).slice(0, 10) + ' έως ' + fmtT(x[1].t); }).catch(function(){});
    if(pending){ var p = page; search(true); if(p * PER >= R.length){ page = 0; render(); } }
  }).catch(function(e){ $('st').innerHTML = '<span class="err">Δεν φορτώθηκε το ιστορικό (' + e.message + '). Ξαναφόρτωσε τη σελίδα.</span>'; });
})();
</script>
<div id="appVer" style="text-align:center;font-size:11px;color:#64748b;padding:10px 0 90px">έκδοση v15 · 10/11/2026</div>
</body>
</html>
