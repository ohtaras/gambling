var SCPAYS = {12:{12:500000,11:6250,10:625,9:250,8:37.5,7:8,6:3}, 11:{11:250000,10:3750,9:375,8:62.5,7:12.5,6:5,5:1},
  10:{10:50000,9:2500,8:125,7:25,6:8,5:1.5}, 9:{9:20000,8:1000,7:50,6:7.5,5:2,4:1}, 8:{8:7500,7:250,6:17.5,5:4,4:1.5}, 7:{7:2500,6:40,5:8,4:1.5,3:1}, 6:{6:800,5:20,4:3.5,3:1},
  5:{5:225,4:12.5,3:1.5}, 4:{4:62.5,3:4,2:1.75}, 3:{3:25,2:3.75}, 2:{2:8,1:3.5}, 1:{1:8.5}};
function scWin(K,a,b){ var m = (PAYS[K]||{})[a]||0; return b>0 ? Math.max(m, (SCPAYS[K]||{})[a+b]||0) : m; }
function useSC(){ return lsGet('trv_sc')==='1'; }
var STAKE = 0.5, DR = {};
function eur(x){ return x.toLocaleString('el-GR',{minimumFractionDigits:2, maximumFractionDigits:2})+'€'; }
function tkLoad(){ try{ return JSON.parse(lsGet('trv_tk')||'[]'); }catch(e){ return []; } }
function tkSave(T){ lsSet('trv_tk', JSON.stringify(T)); }
(function(){ try{ var c = JSON.parse(lsGet('trv_dr2')||'{}'); for(var k in c) DR[k] = c[k]; }catch(e){} })();
function drSave(){ var T = tkLoad(), keep = {}; T.forEach(function(t){ for(var i=0;i<t.draws;i++){ var id = t.start+i; if(DR[id]) keep[id] = DR[id]; } }); DR = keep; lsSet('trv_dr2', JSON.stringify(keep)); }
async function tkCheck(){
  var T = tkLoad(); if(!T.length || !last) { tkRender(); return; }
  var need = []; T.forEach(function(t){ for(var i=0;i<t.draws;i++){ var id = t.start+i; if(id<=last.id && !DR[id]) need.push(id); } });
  if(need.length){ var lo = Math.min.apply(null, need), hi = Math.max.apply(null, need);
    try{ for(var pg=0; pg<40; pg++){
        var r = await fetch('https://api.opap.gr/draws/v3.0/1100/draw-id/'+lo+'/'+hi+'?page='+pg+'&_='+Date.now(), {cache:'no-store'}); if(!r.ok) break;
        var j = await r.json(); (j.content||[]).forEach(function(c){ if(c.winningNumbers && c.winningNumbers.list && c.winningNumbers.list.length) DR[c.drawId] = [c.drawTime, c.winningNumbers.list, c.winningNumbers.secondChance||[]]; });
        if(j.last || pg >= (j.totalPages||1)-1) break; }
    }catch(e){}
    drSave(); }
  tkRender();
}
function tkRender(){
  var T = tkLoad(), SC = useSC(); $('tkCnt').textContent = '('+T.length+'/5)'; $('scSw').checked = SC; $('scLbl').textContent = SC ? 'ΝΑΙ' : 'ΟΧΙ';
  if(!T.length){ $('tkList').innerHTML = '<div class="muted" style="font-size:13px;margin-top:6px">Κούνα το κουτάκι και πάτα «➕ Προσθήκη στο δελτίο» για να το παρακολουθείς στις επόμενες κληρώσεις. Έως 5 δελτία.</div>'; return; }
  $('tkList').innerHTML = T.map(function(t){
    var K = t.n.length, rows = '', won = 0, done = 0, lastHits = null, best = 0;
    for(var i=0;i<t.draws;i++){ var id = t.start+i, d = DR[id];
      if(!d){ rows += '<tr><td>#'+id+'</td><td colspan="3" class="muted">'+(last && id<=last.id ? 'φορτώνει…' : (last && id===last.id+1 ? '⏳ επόμενη κλήρωση' : 'σε αναμονή'))+'</td></tr>'; continue; }
      done++; var set = {}, ss = {}; d[1].forEach(function(x){ set[x] = 1; }); (d[2]||[]).forEach(function(x){ ss[x] = 1; }); var hits = t.n.filter(function(x){ return set[x]; }), sh = SC ? t.n.filter(function(x){ return ss[x]; }) : []; var w = SC ? scWin(K, hits.length, sh.length) : ((PAYS[K]||{})[hits.length]||0); won += w; lastHits = {}; for(var hk in set) lastHits[hk] = 1; if(SC) for(var sk2 in ss) lastHits[sk2] = 2; if(hits.length+sh.length>best) best = hits.length+sh.length;
      rows += '<tr><td>#'+id+' · '+hm(d[0])+'</td><td><b>'+hits.length+(sh.length?'<span style="color:#c4b5fd">+'+sh.length+'</span>':'')+'/'+K+'</b></td><td class="muted">'+(hits.join(' ')||'—')+(sh.length?' <span style="color:#c4b5fd">🟣'+sh.join(' ')+'</span>':'')+'</td><td'+(w?' class="win"':'')+'>'+(w?eur(w):'—')+'</td></tr>'; }
    var cost = t.draws*(SC ? 1 : STAKE), fin = done===t.draws;
    return '<div class="tk"><div class="hd"><span style="font-weight:800">'+K+' αριθμοί · '+t.draws+' κληρώσεις <span class="muted" style="font-weight:400;font-size:12px">από #'+t.start+'</span></span><button class="btn2" data-del="'+t.id+'" style="padding:3px 9px;font-size:12px">🗑</button></div>'+
      '<div style="margin-top:6px">'+t.n.map(function(x){ return '<span class="chip'+(lastHits&&lastHits[x]===1?' hit':(lastHits&&lastHits[x]===2?' sch':''))+'">'+x+'</span>'; }).join('')+'</div>'+
      '<div style="font-size:13px;margin-top:6px">'+(fin?'✅ Τελείωσε':'▶️ Σε εξέλιξη')+' · '+done+'/'+t.draws+' κληρώσεις · καλύτερο '+best+'/'+K+' · κόστος '+eur(cost)+(SC?' (1€/κλήρωση με 2η ευκαιρία)':' (0,50€/κλήρωση)')+' · κέρδη <span class="'+(won?'win':'')+'">'+eur(won)+'</span></div>'+
      '<table class="dr">'+rows+'</table></div>';
  }).join('');
}
$('tkList').addEventListener('click', function(e){ var b = e.target.closest && e.target.closest('[data-del]'); if(!b) return; if(!confirm('Να σβηστεί το δελτίο;')) return; tkSave(tkLoad().filter(function(t){ return String(t.id)!==b.dataset.del; })); drSave(); tkRender(); });
function navUpd(){ var L = $('navLive'); if(!L || !last) return; var live = !view; L.classList.toggle('off', !live); L.textContent = live ? '🟢 LIVE' : '⏩ LIVE';
  Array.prototype.forEach.call(document.querySelectorAll('[data-nv]'), function(b){ var k = b.dataset.nv; if(k==='live') return; b.disabled = busy || (+k>0 && live); }); }
async function navTo(id, dir){ if(busy || !last) return; if(id >= last.id){ view = null; } else {
    var d = NAV[id];
    if(!d){ $('boxHd').textContent = '⏳ Φορτώνω την κλήρωση #'+id+'…';
      try{ var r = await fetch('https://api.opap.gr/draws/v3.0/1100/'+id+'?_='+Date.now(), {cache:'no-store'}); if(!r.ok) throw 0; var c = await r.json(), w = c.winningNumbers||{}; if(!w.list||!w.list.length) throw 0; d = {id:c.drawId, t:c.drawTime, arr:w.list.slice(), sc:(w.secondChance||[]).slice()}; NAV[id] = d; }
      catch(e){ $('boxHd').textContent = 'Δεν βρέθηκε η κλήρωση #'+id; return; } }
    view = d; }
  out = []; var box = $('boxBox'); start(); predMark(); box.style.setProperty('--sx', (dir||0)*30+'px'); box.classList.remove('sl'); void box.offsetWidth; box.classList.add('sl');
  $('boxTxt').textContent = view ? 'Κούνα το κι από εδώ — ή πήγαινε μπρος-πίσω (σύρε το κουτάκι δεξιά/αριστερά).' : 'Πάτα «📦 Κούνα το!»'; $('boxRes').innerHTML = ''; }
$('navBar').addEventListener('click', function(e){ var b = e.target.closest && e.target.closest('[data-nv]'); if(!b || b.disabled) return; var k = b.dataset.nv;
  if(k==='live'){ navTo(Infinity, 1); return; } navTo(cur().id + (+k), +k>0 ? 1 : -1); });
(function(){ var x0 = null, y0 = 0; var el = $('boxWrap');
  el.addEventListener('touchstart', function(e){ var t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; }, {passive:true});
  el.addEventListener('touchend', function(e){ if(x0===null) return; var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)*1.5 && cur()){ if(dx > 0) navTo(cur().id - 1, -1); else if(view) navTo(cur().id + 1, 1); } }, {passive:true}); })();
document.addEventListener('keydown', function(e){ if(e.key==='ArrowLeft' && cur()) navTo(cur().id-1,-1); if(e.key==='ArrowRight' && view) navTo(cur().id+1,1); });
$('scSw').addEventListener('change', function(){ lsSet('trv_sc', this.checked?'1':'0'); tkRender(); predEval(); Array.prototype.forEach.call(document.querySelectorAll('#boxBox .bxb.pk'), function(b){ b.classList.remove('pk'); }); predMark(); });
tkRender();
$('boxBox').innerHTML = grid();
load(); setInterval(function(){ if(!document.hidden) load(); }, 30000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) load(); });
})();
</script>
